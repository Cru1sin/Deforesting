[project]
name = "frost-analysis"
version = "0.1.0"
description = "Dataset-to-model workflow for image-guided heat-pump defrost timing"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.1,<3",
    "pyarrow>=17,<22",
    "Pillow>=10,<12",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]
ml = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]
tracking = [
    "wandb>=0.28.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib -m 'not slow'"
markers = [
    "slow: opt-in acceptance tests against the full read-only Dataset",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
