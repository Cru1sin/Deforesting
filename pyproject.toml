[project]
name = "frost-analysis"
version = "0.1.0"
description = "Cycle Dataset construction and evidence analysis for heat-pump frost data"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.1,<3",
    "pyarrow>=17,<22",
    "PyWavelets>=1.8,<2",
    "scipy>=1.14,<2",
    "scikit-learn>=1.6,<2",
    "tabulate>=0.9,<1",
    "wandb>=0.28.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pandas-stubs>=2.1",
    "Pillow>=10,<12",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "scipy-stubs>=1.14",
]
ml = [
    "timm>=1.0,<2",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: opt-in acceptance tests against the full read-only Dataset",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "archive", "data", "outputs", "processed", "前期方案"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "main_data.py",
    "main_cost.py",
    "main_train.py",
    "main_evaluate.py",
    "dataloader",
    "cost",
    "model",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["sklearn.*", "torch", "torch.*", "torchvision", "torchvision.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = [
    "main_data",
    "main_cost",
    "main_train",
    "main_evaluate",
    "dataloader",
    "cost",
    "model",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
