input_format:
  sensor_globs:
    - "*.xls"
    - "*.edf"
  image_extensions:
    - ".jpg"
    - ".png"
  timestamp_column: "时间"
  edf:
    pair_tolerance_seconds: 1.0

expected_sensor_interval_seconds: 1
image_match_tolerance_seconds: 2

cycles:
  defrost_channel: defrost_active
  maximum_state_gap_seconds: 5
  debounce_seconds: 20
  minimum_defrost_seconds: 60
  maximum_defrost_seconds: 1200
  minimum_heating_seconds: 1800
  maximum_heating_seconds: 21600
  stable_heating_seconds: 180
  defrost_preparation_setpoint_drop_hz: 10
  defrost_preparation_lookback_seconds: 120
  operating_mode_channel: operating_mode
  required_operating_mode: "3"

process:
  resample_interval_seconds: 10
  minimum_continuous_bucket_coverage: 0.8
  continuous_max_gap_seconds: 60
  control_max_gap_seconds: 30
  baseline:
    stage: frost_development
    baseline_seconds: 60
    minimum_observed_coverage: 0.8
    required_anchor_channels:
      - ambient_temperature
      - water_in_temperature
      - water_out_temperature
      - compressor_frequency
    anchor_maximum_std:
      ambient_temperature: 1.0
      water_in_temperature: 1.0
      water_out_temperature: 1.0
      compressor_frequency: 5.0

channels:
  ambient_temperature:
    source_names: ["p1__T4(22.1)'2_31'"]
    unit: degC
    kind: continuous
    role: context
    resample: mean
    missing: interpolate
    analysis_candidate: false
    valid_range: [-30, 50]

  environment_temperature:
    source_names: ["environment_temperature"]
    unit: degC
    kind: continuous
    role: context
    resample: mean
    missing: interpolate
    analysis_candidate: false

  environment_relative_humidity:
    source_names: ["environment_relative_humidity"]
    unit: "%RH"
    kind: continuous
    role: context
    resample: mean
    missing: interpolate
    analysis_candidate: false

  water_in_temperature:
    source_names: ["p1__Twin(26.1)'2_31'"]
    unit: degC
    kind: continuous
    role: context
    resample: mean
    missing: interpolate
    analysis_candidate: false
    valid_range: [-20, 80]

  water_out_temperature:
    source_names: ["p1__Twout(27.1)'2_31'"]
    unit: degC
    kind: continuous
    role: context
    resample: mean
    missing: interpolate
    analysis_candidate: false
    valid_range: [-20, 80]

  water_temperature_setpoint:
    source_names: ["p1__Ts(37.1)'2_31"]
    unit: degC
    kind: step
    role: control
    resample: last
    missing: forward_fill
    analysis_candidate: false
    valid_range: [-20, 80]

  water_flow:
    source_names: ["p5__FlowQ"]
    unit: m3/h
    kind: continuous
    role: context
    resample: mean
    missing: interpolate
    analysis_candidate: false
    scale: 0.01
    offset: 0.0
    valid_range: [0, 100]

  evaporating_pressure:
    source_names: ["p1__Pe(34.2)'2_12'"]
    unit: MPa_abs
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: true
    coverage_required: true
    expected_frost_direction: decrease
    valid_range: [0, 10]

  evaporating_temperature:
    source_names: ["p1__Te'2_20"]
    unit: degC
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: true
    coverage_required: true
    expected_frost_direction: decrease
    valid_range: [-50, 50]

  coil_temperature:
    source_names: ["p1__T3(21.1)'2_31'"]
    unit: degC
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: true
    coverage_required: true
    expected_frost_direction: decrease
    valid_range: [-50, 80]

  evaporator_inlet_temperature:
    source_names: ["p1__TL(28.1)'2_31'"]
    unit: degC
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: false
    coverage_required: true
    valid_range: [-50, 80]

  fin_temperature:
    source_names: ["p1__Tfin(25.1)'2_31"]
    unit: degC
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: true
    # This channel is not observed in the current experiments; an absent
    # optional sensor must not make sensor_overall missing everywhere.
    coverage_required: false
    expected_frost_direction: decrease
    valid_range: [-50, 80]

  suction_temperature:
    source_names: ["p1__Th(24.1)'2_31'"]
    unit: degC
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: false
    coverage_required: true
    valid_range: [-50, 100]

  superheat:
    source_names: ["p1__SH'2_20"]
    unit: degC
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: false
    coverage_required: true
    valid_range: [-20, 100]

  condensing_pressure:
    source_names: ["p1__Pc(31.2)'2_12'"]
    unit: MPa_abs
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: false
    coverage_required: true
    valid_range: [0, 10]

  condensing_temperature:
    source_names: ["p1__Tc'2_20"]
    unit: degC
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: false
    coverage_required: true
    valid_range: [-50, 120]

  plate_heat_exchanger_inlet_temperature:
    source_names: ["p1__T2b(20.1)'2_20"]
    unit: degC
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: false
    coverage_required: true
    valid_range: [-50, 120]

  plate_heat_exchanger_outlet_temperature:
    source_names: ["p1__T2(18.1)'2_20"]
    unit: degC
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: false
    coverage_required: true
    valid_range: [-50, 120]

  discharge_temperature:
    source_names: ["p1__Tp(23.1)'2_31'"]
    unit: degC
    kind: continuous
    role: sensor
    resample: mean
    missing: interpolate
    analysis_candidate: false
    coverage_required: true
    valid_range: [-50, 150]

  compressor_frequency:
    source_names: ["p1__运行频率'1_00"]
    unit: Hz
    kind: step
    role: control
    resample: last
    missing: forward_fill
    analysis_candidate: false
    valid_range: [0, 200]

  compressor_frequency_setpoint:
    source_names: ["p1__设定频率<1_00>"]
    unit: Hz
    kind: step
    role: control
    resample: last
    missing: forward_fill
    analysis_candidate: false
    valid_range: [0, 200]

  compressor_current:
    source_names: ["p2__压缩机电流"]
    unit: A
    kind: continuous
    role: control
    resample: mean
    missing: interpolate
    analysis_candidate: false
    valid_range: [0, 200]

  compressor_power:
    source_names: ["p5__压机功率"]
    unit: kW
    kind: continuous
    role: performance
    resample: mean
    missing: none
    analysis_candidate: false
    scale: 0.001

  compressor_speed:
    source_names: ["p2__压缩机转速"]
    unit: rpm
    kind: step
    role: control
    resample: last
    missing: forward_fill
    analysis_candidate: false
    valid_range: [0, 20000]

  fan_speed:
    source_names: ["p2__风机转速"]
    unit: rpm
    kind: step
    role: control
    resample: last
    missing: forward_fill
    analysis_candidate: false
    valid_range: [0, 10000]

  fan_current:
    source_names: ["p2__风机电流"]
    unit: A
    kind: continuous
    role: control
    resample: mean
    missing: interpolate
    analysis_candidate: false
    valid_range: [0, 100]

  exv_opening:
    source_names: ["p1__EXV1'2_20"]
    unit: steps
    kind: step
    role: control
    resample: last
    missing: forward_fill
    analysis_candidate: false
    valid_range: [0, 2000]

  heating_capacity:
    source_names: ["p1__QComp10W'2_32"]
    unit: kW
    kind: continuous
    role: performance
    resample: mean
    missing: none
    analysis_candidate: false
    valid_range: [0, 100]

  power_total:
    source_names: ["p2__总功率"]
    unit: kW
    kind: continuous
    role: performance
    resample: mean
    missing: none
    analysis_candidate: false
    scale: 0.001
    offset: 0.0
    valid_range: [0, 100]

  operating_mode:
    source_names: ["p1__模式(35.0)<1_00>"]
    unit: code
    kind: categorical
    role: event
    resample: last
    missing: none
    analysis_candidate: false

  defrost_active:
    source_names: ["p1__Deforst"]
    unit: null
    kind: event
    role: event
    resample: last
    missing: none
    analysis_candidate: false
    allowed_values:
      "ON": true
      "OFF": false
      "1": true
      "0": false
      TRUE: true
      FALSE: false

  cop:
    unit: dimensionless
    kind: derived
    role: performance
    resample: mean
    missing: none
    analysis_candidate: false
    formula: cop
    dependencies: [heating_capacity, power_total]

  evaporator_capacity:
    unit: kW
    kind: derived
    role: performance
    resample: mean
    missing: none
    analysis_candidate: false
    formula: evaporator_capacity
    dependencies: [heating_capacity, compressor_power]

  pressure_ratio:
    unit: dimensionless
    kind: derived
    role: performance
    resample: mean
    missing: none
    analysis_candidate: false
    formula: pressure_ratio
    dependencies: [condensing_pressure, evaporating_pressure]

  water_delta_temperature:
    unit: degC
    kind: derived
    role: performance
    resample: mean
    missing: none
    analysis_candidate: false
    formula: water_delta_temperature
    dependencies: [water_out_temperature, water_in_temperature]

  superheat_calculated:
    unit: degC
    kind: derived
    role: sensor
    resample: mean
    missing: none
    analysis_candidate: false
    formula: superheat_calculated
    dependencies: [suction_temperature, evaporating_temperature]
